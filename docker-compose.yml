services:
  app:
    build:
      dockerfile: Dockerfile
      context: .
      target: final
      args:
        VERSION: ${CLOUDFLARE_DDNS_VERSION:-dev}
    env_file:
      - .env
    restart: always
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/cloudflare-ddns", "healthcheck"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 30s
