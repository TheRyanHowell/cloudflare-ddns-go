version: 2

project_name: cloudflare-ddns

builds:
  - main: ./cmd/cloudflare-ddns
    binary: cloudflare-ddns
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Tag }}
    # The linux targets must match PLATFORMS in the Makefile (make check-platforms).
    targets:
      - linux_amd64
      - linux_386
      - linux_arm64
      - linux_arm_7
      - linux_arm_6
      - linux_arm_5
      - linux_riscv64
      - linux_ppc64le
      - linux_s390x
      - linux_mips64le
      - linux_loong64
      - darwin_amd64
      - darwin_arm64
      - windows_amd64
      - windows_arm64
      - freebsd_amd64
      - freebsd_arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

release:
  prerelease: auto

changelog:
  use: github
  groups:
    - title: Features
      regexp: '^[a-f0-9]+ feat(\(.+\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^[a-f0-9]+ fix(\(.+\))?!?:'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - '^[a-f0-9]+ (test|chore|ci|docs|refactor|build)(\(.+\))?:'
